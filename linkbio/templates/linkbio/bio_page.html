<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.church_name }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: "Inter", ui-sans-serif, system-ui, sans-serif; background: {{ page.background_color }}; }
</style>
</head>
<body class="min-h-screen flex flex-col items-center px-4 py-12">
    {% if page.avatar %}
    <img src="{{ page.avatar.url }}" class="w-20 h-20 rounded-full object-cover mb-4">
    {% endif %}
    <h1 class="text-white font-bold text-xl mb-1">{{ page.church_name }}</h1>
    {% if page.headline %}
    <p class="text-white/70 text-sm mb-6">{{ page.headline }}</p>
    {% endif %}

    <div class="w-full max-w-sm space-y-3 mt-4">
        {% for link in links %}
        <a href="{% url 'linkbio_public:click' page.church.slug link.pk %}" target="_blank" rel="noopener"
           class="block text-center rounded-xl py-3 font-medium text-white/90 border border-white/20 hover:bg-white/10 transition"
           style="background: {{ page.accent_color }}22;">
            {{ link.title }}
        </a>
        {% endfor %}
    </div>
</body>
</html>
