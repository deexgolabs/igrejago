{% extends "base.html" %}
{% block title %}Fazer doação{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-slate-900 mb-6">Fazer uma doação</h1>

<form method="post" class="form-padrao bg-white border border-slate-200 rounded-xl p-6 max-w-sm space-y-4">
    {% csrf_token %}
    <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">{{ form.amount.label }}</label>
        {{ form.amount }}
        {% if form.amount.errors %}<p class="text-xs text-red-600 mt-1">{{ form.amount.errors|striptags }}</p>{% endif %}
    </div>
    <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white text-sm rounded-lg px-4 py-2 w-full">Continuar</button>
</form>

<style>
.form-padrao input { width: 100%; border: 1px solid #d1d5db; border-radius: 0.5rem; padding: 0.4rem 0.65rem; font-size: 0.875rem; }
</style>
{% endblock %}
