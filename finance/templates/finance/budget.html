{% extends "base.html" %}
{% block title %}Orçamento{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-slate-900">Orçamento</h1>
    <a href="{% url 'finance:list' %}" class="text-sm text-slate-500 hover:text-slate-800">← Financeiro</a>
</div>

<form method="get" class="mb-4 flex items-end gap-3">
    <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Mês</label>
        <input type="month" name="month" value="{{ month_value }}" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm">
    </div>
    <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white text-sm rounded-lg px-4 py-1.5">Ver mês</button>
</form>

<form method="post">
    {% csrf_token %}
    <input type="hidden" name="month" value="{{ month_value }}">
    <div class="bg-white border border-slate-200 rounded-xl overflow-x-auto">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
                <tr>
                    <th class="text-left px-4 py-3">Categoria</th>
                    <th class="text-left px-4 py-3">Previsto (R$)</th>
                    <th class="text-right px-4 py-3">Realizado</th>
                    <th class="text-right px-4 py-3">Diferença</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                {% for row in rows %}
                <tr>
                    <td class="px-4 py-2 text-slate-700">{{ row.label }}</td>
                    <td class="px-4 py-2">
                        <input type="text" name="target_{{ row.category }}" value="{{ row.target|default:'' }}"
                               placeholder="0.00" class="border border-slate-300 rounded-lg px-2 py-1 text-sm w-28">
                    </td>
                    <td class="px-4 py-2 text-right text-slate-600">R$ {{ row.actual }}</td>
                    <td class="px-4 py-2 text-right font-medium {% if row.diff < 0 %}text-red-600{% else %}text-emerald-600{% endif %}">
                        R$ {{ row.diff }}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <button type="submit" class="mt-4 bg-brand-600 hover:bg-brand-700 text-white text-sm rounded-lg px-4 py-2">Salvar orçamento</button>
</form>
{% endblock %}
