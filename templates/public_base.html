<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ church_config.name|default:"Church CRM" }}{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    body { font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
    .form-padrao label { display:block; font-size:0.76rem; font-weight:600; color:#475569; margin-bottom:0.25rem; }
    .form-padrao input, .form-padrao textarea {
        width:100%; border:1px solid #d1d5db; border-radius:0.6rem; padding:0.55rem 0.8rem; font-size:0.9rem;
    }
    .form-padrao p { margin-bottom: 1rem; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<div class="max-w-lg mx-auto px-4 py-10">
    <div class="text-center mb-6">
        {% if church_config.logo %}<img src="{{ church_config.logo.url }}" class="h-14 w-14 rounded-full object-cover mx-auto mb-2">{% endif %}
        <h1 class="text-xl font-bold" style="color:{{ paleta_marca.700 }}">{{ church_config.name|default:"Nossa Igreja" }}</h1>
    </div>

    {% if messages %}
    <div class="mb-4 space-y-2">
        {% for message in messages %}
        <div class="rounded-lg px-4 py-2 text-sm {% if message.tags == 'error' %}bg-red-50 text-red-700{% else %}bg-emerald-50 text-emerald-700{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}

    <p class="text-center mt-8">
        <a href="{% url 'core:privacy_policy' %}" class="text-xs text-slate-400 hover:text-slate-600 underline">Política de Privacidade</a>
    </p>
</div>
</body>
</html>
