{% extends "base.html" %}
{% block title %}Excluir família{% endblock %}
{% block content %}
<div class="max-w-md bg-white border border-slate-200 rounded-xl p-6">
    <h1 class="text-lg font-bold text-slate-900 mb-2">Excluir a família "{{ object.name }}"?</h1>
    <p class="text-sm text-slate-500 mb-4">As pessoas vinculadas continuam cadastradas normalmente, só perdem esse vínculo.</p>
    <form method="post" class="flex gap-2">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white text-sm rounded-lg px-4 py-2">Excluir</button>
        <a href="{% url 'people:family_list' %}" class="text-sm text-slate-500 hover:text-slate-800 px-4 py-2">Cancelar</a>
    </form>
</div>
{% endblock %}
