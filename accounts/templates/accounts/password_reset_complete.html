{% extends "public_base.html" %}
{% block title %}Senha redefinida{% endblock %}
{% block content %}
<div class="bg-white border border-slate-200 rounded-xl p-8 text-center">
    <p class="text-3xl mb-3">✅</p>
    <h2 class="font-bold text-slate-900 mb-1">Senha redefinida!</h2>
    <p class="text-sm text-slate-500 mb-4">Já pode entrar com a sua nova senha.</p>
    <a href="{% url 'accounts:login' %}" class="inline-block text-white font-medium rounded-lg py-2 px-5 text-sm" style="background:{{ paleta_marca.600 }}">

</div>
{% endblock %}
