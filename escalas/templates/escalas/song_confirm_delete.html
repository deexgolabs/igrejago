{% extends "base.html" %}
{% block title %}Excluir música{% endblock %}
{% block content %}
<div class="max-w-md bg-white border border-slate-200 rounded-xl p-6">
    <h1 class="text-lg font-bold text-slate-900 mb-2">Excluir {{ object.title }}?</h1>
    <p class="text-sm text-slate-500 mb-4">
        Ela também sai do repertório de qualquer culto onde já foi escalada. Esta ação não pode ser desfeita.
    </p>
    <form method="post" class="flex gap-2">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white text-sm rounded-lg px-4 py-2">Excluir</button>
        <a href="{% url 'escalas:song_list' %}" class="text-sm text-slate-500 hover:text-slate-800 px-4 py-2">Cancelar</a>
    </form>
</div>
{% endblock %}
